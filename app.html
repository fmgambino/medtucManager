<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>MedTuc Manager | Panel</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/img/logo-Coordinacion-Robotica.png" />
  <link rel="stylesheet" href="./styles.css?v=54.0" />
</head>
<body class="app-protected is-checking-auth">
  <div class="app-shell" id="appShell">
    <aside class="sidebar glass" id="sidebar">
      <div class="sidebar-top">
        <button id="sidebarToggle" class="logo-button" aria-label="Colapsar menú">
          <img src="./assets/img/logo-Coordinacion-Robotica.png" alt="Logo Ministerio de Educación Tucumán" class="brand-logo" />
          <div class="brand-copy">
            <strong>Ministerio de Educación Tucumán</strong>
            <span>Dirección de Informática · Área Soporte Técnico</span>
          </div>
        </button>
      </div>
      <nav class="sidebar-nav" id="navMenu"></nav>
      <div class="sidebar-bottom modern-sidebar-bottom">
        <small>TICKET MANAGER © 2026</small>
        <a class="cafecito-side" href="https://cafecito.app/fmgambino" rel="noopener" target="_blank" aria-label="Invitame un café en Cafecito">
          <img src="https://cdn.cafecito.app/imgs/buttons/button_3.png" alt="Invitame un café en cafecito.app" />
        </a>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar glass">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle">Gestión administrativa integral del Dirección de Informática · Área Soporte Técnico</p>
        </div>
        <div class="topbar-actions">
          <button id="themeToggle" class="icon-toggle" aria-label="Cambiar tema">
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            <span class="toggle-icons" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="icon"><path d="M12 3.5a1 1 0 0 1 1 1V6a1 1 0 1 1-2 0V4.5a1 1 0 0 1 1-1Zm0 14a1 1 0 0 1 1 1V20a1 1 0 1 1-2 0v-1.5a1 1 0 0 1 1-1ZM20.5 11a1 1 0 1 1 0 2H19a1 1 0 1 1 0-2h1.5ZM5 12a1 1 0 0 1-1 1H2.5a1 1 0 1 1 0-2H4a1 1 0 0 1 1 1Zm11.95-5.95a1 1 0 0 1 1.414 0l1.06 1.06a1 1 0 1 1-1.414 1.414l-1.06-1.06a1 1 0 0 1 0-1.414ZM4.576 17.364a1 1 0 0 1 1.414 0l1.06 1.06a1 1 0 1 1-1.414 1.414l-1.06-1.06a1 1 0 0 1 0-1.414Zm0-10.728a1 1 0 0 1 1.414 1.414l-1.06 1.06A1 1 0 1 1 3.516 7.7l1.06-1.06Zm12.788 12.788a1 1 0 0 1 0-1.414l1.06-1.06a1 1 0 1 1 1.414 1.414l-1.06 1.06a1 1 0 0 1-1.414 0ZM12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"></path></svg>
              <svg viewBox="0 0 24 24" class="icon"><path d="M14.5 3.5a8.5 8.5 0 1 0 6 14.5 7.2 7.2 0 0 1-6-14.5Z"></path></svg>
            </span>
          </button>
          <button id="fullscreenBtn" class="icon-button" aria-label="Pantalla completa"></button>
          <div class="notifications-wrapper" id="notificationsWrapper">
            <button id="notificationsBtn" class="icon-button notification-btn" aria-label="Notificaciones"></button>
            <div class="notifications-preview glass" id="notificationsPreview"></div>
          </div>
          <button id="headerLogoutBtn" class="icon-button" aria-label="Salir"></button>
          <button id="avatarUploadBtn" class="avatar-button" aria-label="Cambiar foto de perfil">
            <img id="headerAvatar" src="./assets/avatar-default.svg" alt="Foto de perfil" />
          </button>
          <input type="file" id="avatarInput" accept="image/*" class="hidden" />
          <button id="profileNameBtn" class="profile-chip" aria-label="Mi perfil">
            <span id="headerUserName">Usuario</span>
          </button>
        </div>
      </header>

      <main id="appContent" class="content"></main>

      <footer class="site-footer modern-footer">
        <div class="footer-brand">TICKET MANAGER © 2026</div>
        <div class="footer-copy">Tucumán - Argentina · by <a href="https://github.com/fmgambino" rel="noopener" target="_blank">Ing. Fernando Gambino</a></div>
        <div class="footer-rights">Todos los Derechos Registrados</div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="./js/config.js?v=10.0"></script>
  <script src="./js/supabaseClient.js?v=54.0"></script>
  <script src="./js/utils.js?v=10.0"></script>
  <script src="./js/auth.js?v=10.0"></script>
  <script src="./js/ui.js?v=10.0"></script>
  <script src="./js/dashboard.js?v=10.0"></script>
  <script src="./js/usuarios.js?v=10.0"></script>
  <script src="./js/roles.js?v=10.0"></script>
  <script src="./js/equipos.js?v=10.0"></script>
  <script src="./js/inventario.js?v=10.0"></script>
  <script src="./js/prestamos.js?v=10.0"></script>
  <script>
  (async function(){
    const demo = localStorage.getItem('ism_demo_user');
    if (!demo && window.sb?.enabled) {
      try { const { data } = await window.sb.getSession(); if (!data?.session) location.replace('./index.html'); }
      catch(e){ location.replace('./index.html'); }
    } else if (!demo && !window.sb?.enabled) { location.replace('./index.html'); }
    document.body.classList.remove('is-checking-auth');
  })();
</script>
<script src="./js/app.js?v=54.0"></script>
</body>
</html>
