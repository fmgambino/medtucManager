<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soporte Ticket Público</title><link rel="stylesheet" href="../styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body class="public-body"><main class="public-card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4m5sI9rXqK72J4Ix5rqSA4U4AH3eDjmuJWQ&s" style="max-width:220px"><h1>Solicitud de Soporte Técnico</h1><p>Formulario público para oficinas y reparticiones. No requiere iniciar sesión.</p><form id="ticketForm" class="form"><div class="form-grid"><label>Nombre y apellido<input id="requester_name" required></label><label>Email<input id="requester_email" type="email"></label><label>Teléfono<input id="requester_phone"></label><label>Oficina/Repartición<input id="office" required></label><label>Área<input id="area"></label><label>Prioridad<select id="priority"><option>Media</option><option>Baja</option><option>Alta</option><option>Urgente</option></select></label><label class="full">Asunto<input id="subject" required></label><label>Tipo de incidencia<select id="incidence_type"><option>Software / configuración</option><option>Falla técnica</option><option>Red / Internet</option><option>Impresora</option><option>Solicitud de insumo</option><option>Mantenimiento preventivo</option></select></label><label class="full">Descripción<textarea id="description" required></textarea></label></div><button class="btn primary">Enviar ticket</button><a class="btn ghost" href="../index.html">Acceso administrativo</a></form></main><script src="../js/config.js"></script><script>
const supa=window.supabase.createClient(APP_CONFIG.SUPABASE_URL,APP_CONFIG.SUPABASE_ANON_KEY);
ticketForm.onsubmit=async e=>{e.preventDefault(); const data={requester_name:requester_name.value,requester_email:requester_email.value,requester_phone:requester_phone.value,office:office.value,area:area.value,subject:subject.value,incidence_type:incidence_type.value,description:description.value,priority:priority.value,status:'Pendiente'}; try{const {data:tk,error}=await supa.from('support_tickets').insert(data).select().single(); if(error)throw error; try{ await supa.from('notifications').insert({title:'Nuevo ticket público',body:`${data.office}: ${data.subject}`,module:'tickets',entity_id:tk.id,target_role:'SuperAdmin'}); }catch(_){ } await Swal.fire({icon:'success',title:'Ticket enviado',text:`Número: ${tk.ticket_number}`}); ticketForm.reset();}catch(err){Swal.fire({icon:'error',title:'No se pudo enviar',text:err.message})}}
</script></body></html>
