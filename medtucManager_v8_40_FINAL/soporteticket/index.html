<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="https://www.educaciontuc.gov.ar/wp-content/uploads/2024/10/cropped-icogob-1-180x180.png"><title>Soporte Técnico | Ministerio de Educación</title><link rel="stylesheet" href="../styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script></head><body class="public-body"><header class="public-top"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4m5sI9rXqK72J4Ix5rqSA4U4AH3eDjmuJWQ&s" alt="Ministerio de Educación Tucumán"><div class="public-actions"><button class="icon-btn" onclick="document.documentElement.requestFullscreen?.()">⛶</button><button class="theme-switch" onclick="document.body.classList.toggle('light')"><span>☀</span><span>🌙</span></button></div></header><main class="public-card wide"><h1>Solicitud de Soporte Técnico</h1><p>Formulario público para referentes de oficinas y reparticiones.</p><form id="ticketForm" class="form"><div class="form-grid"><label>Nombre y apellido<input id="requester_name" required></label><label>Email<input id="requester_email" type="email"></label><label>WhatsApp del solicitante<input id="requester_phone" required placeholder="Ej: 3811234567"></label><label>Oficina<select id="office" required><option value="">Sin cargar</option></select></label><label>Área<input id="area" placeholder="Ej: Soporte Técnico"></label><label>Servicio Solicitado<select id="service_type" required><option value="">Seleccione...</option></select></label><label>Cantidad de equipos a revisar<input id="equipment_count" type="number" value="1" min="1" required><small>Si es mayor a 7, se asigna colaborador automáticamente.</small></label><div class="full assign-preview" id="assignPreview"></div><label>Tipo de Equipo<select id="equipment_type" required><option value="">Seleccione...</option><option>PC</option><option>Notebook</option><option>Impresora</option><option>Router/Switch</option><option>Otro</option></select></label><label>Marca<input id="brand" placeholder="Ej: Magnum Tech" required></label><label>Modelo<input id="model" placeholder="Ej: MT-XXXX" required></label><label class="full">Accesorios<textarea id="accessories" required placeholder="Ej: Cable power, teclado, mouse, HDMI, etc."></textarea></label><label class="full">Falla / Descripción del Reclamo<textarea id="description" required placeholder="Describa la falla y cualquier dato relevante."></textarea></label><label>Prioridad<select id="priority"><option>Baja</option><option selected>Media</option><option>Alta</option><option>Urgente</option></select></label><label>Foto del Equipo (obligatoria)<input id="photo" type="file" accept="image/*" required><small>Se adjunta como referencia del reclamo.</small></label></div><button class="btn primary">Enviar ticket</button><a class="btn ghost" href="../index.html">Acceso administrativo</a></form></main><script src="../js/config.js"></script><script>
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
let technicians=[];
async function loadCatalogs(){
  const [offices,tasks,techs]=await Promise.all([supa.from('offices').select('*').eq('is_active',true).order('name'),supa.from('task_types').select('*').eq('is_active',true).order('name'),supa.from('profiles').select('id,full_name,email,role_name,is_active').in('role_name',['Técnicos','Tecnicos']).eq('is_active',true).order('full_name')]);
  $('office').innerHTML='<option value="">Seleccione...</option>'+((offices.data||[]).map(o=>{const label=[o.department,o.repartition,o.office_name||o.name,o.dependency,o.room].filter(Boolean).join(' / ')||o.name; return `<option value="${label.replaceAll('"','&quot;')}">${label}</option>`}).join(''));
  $('service_type').innerHTML='<option value="">Seleccione...</option>'+((tasks.data||[]).map(t=>`<option value="${t.name.replaceAll('"','&quot;')}">${t.name}</option>`).join(''));
  technicians=techs.data||[]; updateAssignmentPreview();
}
function updateAssignmentPreview(){
  const qty=parseInt($('equipment_count').value||'1',10); const idx=Math.abs((String($('service_type').value).length+qty))%Math.max(technicians.length,1); const main=technicians[idx]; let coll=null; if(qty>7 && technicians.length>1) coll=technicians[(idx+1)%technicians.length];
  $('assignPreview').innerHTML = main ? `<p>Responsable Técnico: ${main.full_name}</p>${qty>7?`<p>Colaborador Técnico: ${coll?coll.full_name:'No hay colaboradores disponibles'}</p>`:''}<small>Asignación previa, la definitiva se confirma al enviar.</small>` : '<small>Sin técnicos disponibles para preasignación.</small>';
}
$('service_type').addEventListener('change',updateAssignmentPreview); $('equipment_count').addEventListener('input',updateAssignmentPreview);
ticketForm.onsubmit=async e=>{e.preventDefault(); const data={requester_name:requester_name.value.trim(),requester_email:requester_email.value.trim(),requester_phone:requester_phone.value.trim(),office:office.value,area:area.value.trim(),service_type:service_type.value,incidence_type:service_type.value,subject:service_type.value,equipment_count:parseInt(equipment_count.value||'1',10),equipment_type:equipment_type.value,brand:brand.value.trim(),model:model.value.trim(),accessories:accessories.value.trim(),description:description.value.trim(),priority:priority.value,status:'Pendiente'}; try{const {data:tk,error}=await supa.from('support_tickets').insert(data).select().single(); if(error)throw error; try{ await supa.from('notifications').insert({title:'Nuevo ticket público',body:`${data.office}: ${data.service_type}`,module:'tickets',entity_id:tk.id,target_role:'SuperAdmin'}); }catch(_){ } await Swal.fire({icon:'success',title:'Ticket enviado',text:`Número: ${tk.ticket_number}`}); ticketForm.reset(); updateAssignmentPreview();}catch(err){Swal.fire({icon:'error',title:'No se pudo enviar',text:err.message})}};
loadCatalogs();
</script></body></html>
