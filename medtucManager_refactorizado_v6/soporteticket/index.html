<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario Público | Ticket Manager</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../styles.css?v=tm4" />
  <style>
    body.public-ticket{min-height:100vh;background:linear-gradient(135deg,#f6f3ff,#eef6ff);color:#111827}.public-header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,54px)}.public-brand{display:flex;gap:12px;align-items:center;font-weight:950}.public-brand img{width:46px}.public-main{width:min(1120px,94vw);margin:20px auto 50px}.public-hero{background:#fff;border-radius:30px;padding:34px;box-shadow:0 20px 70px rgba(60,50,130,.14);display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center}.public-hero h1{font-size:clamp(2rem,5vw,4rem);letter-spacing:-.05em;margin:0}.public-hero p{color:#64748b;font-size:1.1rem}.public-visual{border-radius:26px;background:linear-gradient(135deg,#6d5dfc,#8b5cf6);min-height:220px;position:relative;overflow:hidden}.public-visual:before{content:"";position:absolute;inset:10%;border:2px solid rgba(255,255,255,.35);border-radius:34px;animation:pulse 2.4s infinite}.public-form{margin-top:22px;background:#fff;border-radius:30px;padding:26px;box-shadow:0 20px 70px rgba(60,50,130,.12);display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.public-form label{display:grid;gap:8px;font-weight:850}.public-form input,.public-form select,.public-form textarea{border:1px solid #e5e7eb;background:#f8fafc;border-radius:16px;padding:14px;font:inherit}.public-form .full{grid-column:1/-1}.public-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:12px}.public-actions button,.public-actions a{border:0;border-radius:16px;padding:14px 20px;font-weight:900;text-decoration:none}.send{background:linear-gradient(135deg,#6d5dfc,#934cff);color:#fff}.back{background:#eef2ff;color:#4f46e5}@media(max-width:820px){.public-hero,.public-form{grid-template-columns:1fr}.public-actions{flex-direction:column}.public-actions button,.public-actions a{text-align:center}}
  </style>
</head>
<body class="public-ticket">
<header class="public-header"><div class="public-brand"><img src="../assets/logo.svg" alt="Ticket Manager"><span>Ticket Manager · Soporte Técnico</span></div><a class="back" href="../index.html">Ingreso privado</a></header>
<main class="public-main">
  <section class="public-hero"><div><h1>Ticket de Soporte Técnico</h1><p>Formulario público para oficinas y reparticiones. El reclamo ingresa al módulo <strong>Soporte Ticket</strong> del panel administrativo.</p></div><div class="public-visual"><div class="ticket-float t1">TK</div><div class="ticket-float t2">IT</div></div></section>
  <form id="publicTicketForm" class="public-form">
    <label><span>Solicitante</span><input id="requester_name" required placeholder="Nombre y apellido"></label>
    <label><span>Email</span><input id="requester_email" type="email" required placeholder="correo@educaciontuc.gov.ar"></label>
    <label><span>WhatsApp</span><input id="requester_phone" required placeholder="3811234567"></label>
    <label><span>Oficina / Repartición</span><input id="office" required placeholder="Dirección / Área / Escuela"></label>
    <label><span>Tipo de incidencia</span><select id="incident_type" required><option value="">Seleccionar…</option><option>Falla técnica</option><option>Software / configuración</option><option>Mantenimiento preventivo</option><option>Falta de insumo</option><option>Conectividad</option><option>Impresora</option><option>Otro</option></select></label>
    <label><span>Tipo de equipo</span><select id="asset_type" required><option value="">Seleccionar…</option><option>CPU</option><option>Monitor</option><option>Notebook</option><option>Impresora</option><option>Red / conectividad</option><option>Otro</option></select></label>
    <label><span>Marca</span><input id="brand" placeholder="Ej: Lenovo, HP, Epson"></label>
    <label><span>Modelo / Serie / Patrimonio</span><input id="serial" placeholder="Serie, patrimonio o inventario"></label>
    <label class="full"><span>Accesorios entregados</span><textarea id="accessories" rows="3" placeholder="Cable power, teclado, mouse, etc."></textarea></label>
    <label class="full"><span>Descripción de la falla</span><textarea id="description" rows="5" required placeholder="Describa la falla y cualquier dato relevante."></textarea></label>
    <label class="full"><span>Foto del equipo (opcional)</span><input id="photo" type="file" accept="image/*"></label>
    <div class="public-actions"><a class="back" href="../index.html">Volver</a><button class="send" type="submit">Enviar ticket</button></div>
  </form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/config.js"></script>
<script>
const cfg = window.APP_CONFIG || {}; const enabled = cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase; const client = enabled ? window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY) : null;
function ticketNumber(){ return `TK-${new Date().getFullYear()}-${String(Date.now()).slice(-5)}`; }
document.getElementById('publicTicketForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn=e.submitter; btn.disabled=true;
  const row={ticket_number:ticketNumber(),title:document.getElementById('incident_type').value + ' - ' + document.getElementById('asset_type').value,status:'Pendiente',incident_type:document.getElementById('incident_type').value,asset_label:[document.getElementById('asset_type').value,document.getElementById('brand').value,document.getElementById('serial').value].filter(Boolean).join(' · '),room:document.getElementById('office').value,requester_name:document.getElementById('requester_name').value,requester_email:document.getElementById('requester_email').value,requester_phone:document.getElementById('requester_phone').value,description:document.getElementById('description').value + '\n\nAccesorios: ' + document.getElementById('accessories').value,history:'Creado desde formulario público /soporteticket',created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  try{ if(client){ const {error}=await client.from('support_tickets').insert(row); if(error) throw error; } else { const arr=JSON.parse(localStorage.getItem('public_support_tickets')||'[]'); arr.unshift(row); localStorage.setItem('public_support_tickets',JSON.stringify(arr)); }
    await Swal.fire({icon:'success',title:'Ticket enviado',html:`Su número de seguimiento es <b>${row.ticket_number}</b>.`}); e.target.reset();
  }catch(err){ Swal.fire({icon:'error',title:'No se pudo enviar',text:err.message||String(err)}); } finally{btn.disabled=false;}
});
</script>
</body>
</html>
