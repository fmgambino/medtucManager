<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1220" />
  <title>ISM Robosoft | Recuperar contraseña</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="auth-page">
  <main class="login-shell compact auth-single">
    <section class="auth-card glass auth-card-clean">
      <img src="./assets/img/logo-Coordinacion-Robotica.png" alt="Instituto San Miguel" class="brand-logo large centered-logo" />
      <span class="badge">Acceso seguro</span>
      <h2>Recuperar contraseña</h2>
      <p class="muted">Ingresá tu email y te enviaremos un enlace para crear una nueva contraseña.</p>
      <form id="recoverForm" class="form-grid single-col">
        <label><span>Email</span><input type="email" id="recoverEmail" autocomplete="email" required /></label>
        <button class="btn btn-primary" type="submit">Enviar enlace</button>
      </form>
      <div class="auth-links-row"><a class="btn btn-secondary" href="./index.html">Volver al login</a><a class="btn btn-secondary" href="./registro.html">Crear cuenta</a></div>
      <p id="authMessage" class="form-message"></p>
      <a class="cafecito-auth" href="https://cafecito.app/fmgambino" rel="noopener" target="_blank"><img srcset="https://cdn.cafecito.app/imgs/buttons/button_3.png 1x, https://cdn.cafecito.app/imgs/buttons/button_3_2x.png 2x, https://cdn.cafecito.app/imgs/buttons/button_3_3.75x.png 3.75x" src="https://cdn.cafecito.app/imgs/buttons/button_3.png" alt="Invitame un café en cafecito.app" /></a>
    </section>
  </main>
  <footer class="site-footer modern-footer"><div class="footer-brand">ISM ROBOSOFT© 2026</div><div class="footer-copy">Tucumán · Argentina · by <a href="https://electronicagambino.com" rel="noopener" target="_blank">Ing. Fernando Gambino</a></div><div class="footer-rights">Todos los Derechos Registrados · @ Cafecito</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/config.js?v=8.7"></script>
  <script src="./js/supabaseClient.js?v=8.7"></script>
  <script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));</script>
  <script src="./recuperar.js?v=8.7"></script>
</body>
</html>
